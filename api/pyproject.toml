[project]
name = "three-kingdoms"
version = "0.1.0"
description = "A game simulation engine where you talk to Three Kingdoms characters, powered by LangGraph agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "langchain-core>=0.3.34",
    "langchain-groq>=0.2.4",
    "langchain-openai>=0.3.0",
    "langchain-mongodb>=0.4.0",
    "langgraph>=0.2.70",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "opik>=1.4.11",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pymongo>=4.9.2",
    "loguru>=0.7.3",
    "langchain-huggingface>=0.1.2",
    "langchain-community>=0.3.17",
    "wikipedia>=1.4.0",
    "datasketch>=1.6.5",
    "ipykernel>=6.29.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.7.2",
    "pre-commit>=4.1.0",
    "langgraph-cli[inmem]>=0.4.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/three_kingdoms"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E 代码风格, F 逻辑错误(未用变量/import), I import 排序
select = ["E", "F", "I"]
ignore = ["E501"]
